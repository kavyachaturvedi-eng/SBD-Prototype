<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBD Module — Skill-Based Deployment</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f3;height:100vh;overflow:hidden}
#root{height:100vh}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:236px;min-width:236px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:14px 16px;border-bottom:1px solid #e5e5e5;flex-shrink:0}
.logo-title{font-size:13px;font-weight:600;color:#1a1a1a;display:flex;align-items:center;gap:6px}
.logo-sub{font-size:11px;color:#888;margin-top:2px}
.nav-sec{padding:14px 14px 4px;font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;border-radius:7px;margin:1px 6px;font-size:13px;color:#555;transition:background .12s,color .12s;user-select:none}
.nav-item:hover{background:#f2f2f0;color:#1a1a1a}
.nav-item.active{background:#e8f0fe;color:#1a56b0;font-weight:500}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px}
.t-title{font-size:15px;font-weight:600;color:#1a1a1a}
.t-meta{font-size:11px;color:#888;margin-top:1px}
.topbar-right{display:flex;gap:8px;align-items:center}
.role-switcher{display:flex;align-items:center;gap:4px;background:#f5f5f3;border:1px solid #e5e5e5;border-radius:9px;padding:3px}
.role-switcher-label{font-size:10px;color:#888;font-weight:500;padding:0 8px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.role-pill{display:inline-flex;align-items:center;padding:7px 14px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;color:#555;transition:all .12s}
.role-pill:hover{background:#fff;color:#1a1a1a}
.role-pill.active{background:#1a56b0;color:#fff;box-shadow:0 1px 3px rgba(26,86,176,.3)}
.content{padding:18px 20px;flex:1;overflow-y:auto;overflow-x:hidden}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.bs{background:#e8f5e9;color:#2e7d32}.bw{background:#fff8e1;color:#b45309}.bd{background:#fdecea;color:#b71c1c}.bi{background:#e8f0fe;color:#1a56b0}.bg{background:#f0f0ee;color:#666}
.tag-m{background:#e8f0fe;color:#1a56b0;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500}
.tag-nm{background:#e8f5e9;color:#2e7d32;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500}
.devx-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;background:#f0e8ff;color:#5b21b6;border:1px solid #c4a8f0;white-space:nowrap}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:7px;border:1px solid #d0d0cc;background:#fff;cursor:pointer;font-size:12px;color:#1a1a1a;font-family:inherit;transition:background .12s;white-space:nowrap}
.btn:hover:not(:disabled){background:#f2f2f0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#1a56b0;color:#fff;border-color:transparent}.btn-primary:hover:not(:disabled){background:#154fa0}
.btn-success{background:#2e7d32;color:#fff;border-color:transparent}.btn-success:hover:not(:disabled){background:#256428}
.btn-warning{background:#e65100;color:#fff;border-color:transparent}.btn-warning:hover:not(:disabled){background:#bf360c}
.btn-danger{background:#c62828;color:#fff;border-color:transparent}.btn-danger:hover:not(:disabled){background:#a31515}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-xs{padding:2px 7px;font-size:10px}

/* FORMS */
input,select,textarea{padding:7px 10px;border-radius:7px;border:1px solid #d5d5d0;background:#fff;font-size:13px;color:#1a1a1a;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a56b0;box-shadow:0 0 0 3px rgba(26,86,176,.08)}
input[disabled],select[disabled]{background:#f5f5f3;color:#aaa;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:500;color:#555}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-weight:500;font-size:11px;color:#666;border-bottom:1px solid #e5e5e5;background:#fafafa;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f0f0ee;color:#1a1a1a;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafaf8}
.scroll-x{overflow-x:auto}

/* CARDS */
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;margin-bottom:14px;overflow:hidden}
.card-header{padding:11px 16px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;background:#fafafa;gap:10px;flex-wrap:wrap}
.card-header-title{font-size:13px;font-weight:600;color:#1a1a1a}
.card-body{padding:16px}
.note{font-size:11px;color:#888;padding:5px 2px;margin-bottom:10px;line-height:1.5}

/* FILTER ROW */
.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-row input,.filter-row select{padding:6px 10px;font-size:12px;width:auto}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}

/* METRICS */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.metric{background:#fff;border:1px solid #e5e5e5;border-radius:9px;padding:12px 15px}
.metric-label{font-size:11px;color:#888;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:600;color:#1a1a1a;line-height:1.1}
.metric-sub{font-size:10px;color:#aaa;margin-top:2px}

/* MASTERS HOME */
.master-row{display:grid;grid-template-columns:1fr 130px 160px 200px 90px;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f0ee;cursor:pointer;transition:background .1s;gap:10px}
.master-row:last-child{border-bottom:none}
.master-row:hover{background:#fafafa}
.master-name{font-size:13px;font-weight:500;color:#1a1a1a}
.master-desc{font-size:11px;color:#888;margin-top:2px}

/* SPLIT */
.split{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}

/* MANPOWER PANEL */
.mp-panel{background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;position:sticky;top:0}
.mp-panel-header{padding:10px 14px;border-bottom:1px solid #e5e5e5;background:#fafafa}
.mp-panel-title{font-size:12px;font-weight:600;color:#1a1a1a}
.mp-panel-context{font-size:11px;color:#888;margin-top:2px}
.mp-panel-body{padding:10px;max-height:calc(100vh - 220px);overflow-y:auto}
.mp-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#888;padding:6px 4px 4px;border-top:1px solid #f0f0ee;margin-top:6px}
.mp-section-label:first-child{border-top:none;margin-top:0;padding-top:0}
.mp-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e5e5e5;border-radius:7px;margin-bottom:5px;cursor:pointer;transition:all .12s}
.mp-row:hover{border-color:#1a56b0;background:#f0f4ff}
.mp-row.absent{opacity:.65;border-style:dashed}
.mp-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.mp-name{font-size:12px;font-weight:500;flex:1;min-width:0}
.mp-meta{font-size:10px;color:#888}
.mp-skill{font-size:12px;font-weight:700;flex-shrink:0}
.mp-empty{font-size:12px;color:#aaa;text-align:center;padding:20px 10px}

/* SKILL COLOURS */
.skill-hi{color:#2e7d32;font-weight:600}
.skill-mid{color:#b45309;font-weight:600}
.skill-lo{color:#b71c1c;font-weight:600}

/* OP TABLE */
.op-row.bottleneck td{background:#fff9f9}
.bn-badge{font-size:9px;font-weight:700;color:#b71c1c;background:#fdecea;padding:1px 5px;border-radius:3px;margin-left:5px}
.gap-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.gap-green{background:#4caf50}.gap-amber{background:#ff9800}.gap-red{background:#f44336}.gap-blue{background:#2196f3}

/* EFF HEADER */
.eff-header{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.eff-block{background:#fff;border:1px solid #e5e5e5;border-radius:9px;padding:10px 14px}
.eff-block-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.eff-block-value{font-size:22px;font-weight:700;color:#1a1a1a;line-height:1.1}
.eff-block-sub{font-size:10px;color:#aaa;margin-top:2px}

/* SAVE BAR */
.save-bar{background:#f0f4ff;border:1px solid #c7d7f5;border-radius:9px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.save-bar-label{font-size:12px;color:#1a3a6b;flex:1;min-width:200px}
.save-bar-label strong{display:block;margin-bottom:2px}

/* BANNERS */
.ob-banner{background:#f0f4ff;border:1px solid #c7d7f5;border-radius:8px;padding:10px 14px;margin-bottom:13px;display:flex;align-items:center;gap:14px;font-size:12px;flex-wrap:wrap}
.ob-banner-item span{display:block;font-size:10px;color:#4a6fa5;text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.ob-banner-item strong{font-size:13px;color:#1a3a6b}
.smv-alert{background:#fff8e1;border:1px solid #ffe082;border-radius:9px;padding:11px 14px;margin-bottom:13px}
.smv-alert-title{font-size:12px;font-weight:600;color:#7a5000;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.smv-alert-body{font-size:11px;color:#7a5000;line-height:1.55;margin-bottom:8px}
.bn-suggest{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:8px;padding:10px 14px;margin-top:10px;display:flex;align-items:flex-start;gap:10px}
.bn-suggest-body{flex:1}
.bn-suggest-title{font-size:12px;font-weight:600;color:#1b5e20;margin-bottom:3px}
.bn-suggest-text{font-size:11px;color:#2e7d32;line-height:1.5}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:13px;width:500px;max-width:95vw;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.2)}
.modal-lg{width:640px}
.modal-sm{width:420px}
.modal-header{background:#1a3a6b;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:14px;font-weight:600;color:#fff}
.modal-sub{font-size:11px;color:#8ab4f8;margin-top:2px}
.modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.modal-close:hover{background:rgba(255,255,255,.3)}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 18px;border-top:1px solid #e5e5e5;display:flex;gap:8px;justify-content:flex-end;background:#fafafa;flex-wrap:wrap}
.skill-result{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;background:#f0f4ff;border:1px solid #c7d7f5;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.skill-result.good{background:#e8f5e9;border-color:#a5d6a7}.skill-result.warn{background:#fff8e1;border-color:#ffe082}.skill-result.bad{background:#fdecea;border-color:#ef9a9a}
.skill-result-label{font-size:11px;color:#4a6fa5;font-weight:500}
.skill-result-value{font-size:28px;font-weight:700;color:#1a3a6b}

/* MODE CARDS */
.mode-card{border:1.5px solid #e5e5e5;border-radius:9px;padding:12px 14px;cursor:pointer;transition:all .12s;margin-bottom:8px}
.mode-card:hover{border-color:#1a56b0;background:#f0f4ff}
.mode-card.selected{border-color:#1a56b0;background:#e8f0fe}
.mode-card-name{font-size:13px;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.mode-card-desc{font-size:11px;color:#888}

/* TRAINING PANEL */
.tr-panel{position:fixed;right:0;top:0;bottom:0;width:340px;background:#fff;border-left:1px solid #e5e5e5;z-index:50;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.1);transition:transform .25s ease}
.tr-panel.closed{transform:translateX(100%)}
.tr-panel.open{transform:translateX(0)}
.tr-header{background:#1a3a6b;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.tr-title{color:#fff;font-size:14px;font-weight:600}
.tr-body{flex:1;overflow-y:auto;padding:14px}
.tr-item{background:#fafafa;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.tr-item-name{font-size:12px;font-weight:600;margin-bottom:2px}
.tr-item-op{font-size:11px;color:#888;margin-bottom:6px}

/* DAILY ROW */
.daily-op-row{display:grid;grid-template-columns:36px 1fr 90px 80px 90px 1fr;align-items:center;padding:10px 12px;border-bottom:1px solid #f0f0ee;cursor:pointer;gap:10px}
.daily-op-row:last-child{border-bottom:none}
.daily-op-row:hover{background:#fafaf8}
.daily-op-row.selected{background:#e8f0fe}
.daily-header-row{display:grid;grid-template-columns:36px 1fr 90px 80px 90px 1fr;align-items:center;padding:8px 12px;border-bottom:1px solid #e5e5e5;background:#fafafa;font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;gap:10px}
.seq-circle{width:28px;height:28px;border-radius:50%;background:#f0f0ee;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#666}
.seq-circle.has-absent{background:#fdecea;color:#b71c1c}
.op-chip{display:inline-flex;align-items:center;gap:4px;background:#f0f0ee;border-radius:4px;padding:2px 7px;font-size:11px;margin:2px}
.op-chip.auto-filled{background:#e8f5e9;color:#2e7d32;border:1px dashed #a5d6a7}
.op-chip.absent{background:#fdecea;color:#b71c1c;text-decoration:line-through}

/* URGENCY */
.urgency-bar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:9px;margin-bottom:12px;border:1px solid #e5e5e5;background:#fff}
.urgency-timer{font-size:22px;font-weight:700;color:#1a1a1a;font-variant-numeric:tabular-nums}
.urgency-label{font-size:11px;color:#888}
.urgency-gaps{font-size:12px;font-weight:600;margin-left:auto}

/* AUTOFILL BANNER */
.autofill-banner{background:#1a3a6b;border-radius:10px;padding:13px 16px;margin-bottom:13px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.autofill-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.autofill-body{flex:1;min-width:200px}
.autofill-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:3px}
.autofill-sub{font-size:11px;color:#8ab4f8;line-height:1.5}
.autofill-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;flex-wrap:wrap}
.btn-approve-all{background:#4caf50;color:#fff;border:none;padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-approve-all:hover{background:#388e3c}

/* SUMMARY BAR */
.summary-bar{background:#f0f4ff;border:1px solid #c7d7f5;border-radius:9px;padding:12px 16px;display:flex;align-items:center;gap:24px;margin-top:13px;flex-wrap:wrap}
.summary-item .s-label{font-size:10px;color:#4a6fa5;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.summary-item .s-value{font-size:18px;font-weight:600;color:#1a3a6b}
.summary-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* PHASE 6 */
.trend-card{background:#fff;border:1px solid #e5e5e5;border-radius:9px;padding:12px}
.sparkline{display:flex;align-items:flex-end;gap:2px;height:36px;margin:8px 0}
.spark-bar{flex:1;border-radius:2px 2px 0 0;min-width:6px}
.capture-priority-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #e5e5e5;border-radius:7px;margin-bottom:6px;cursor:pointer;background:#fff;flex-wrap:wrap}
.capture-priority-item:hover{border-color:#5b21b6;background:#f3f0ff}
.cp-reason{font-size:10px;color:#5b21b6;background:#f3f0ff;padding:1px 6px;border-radius:3px}

/* HEATMAP */
.hm-cell{display:inline-flex;align-items:center;justify-content:center;width:38px;height:26px;border-radius:4px;font-size:11px;font-weight:600}
.hm-0{background:#fdecea;color:#b71c1c}.hm-lo{background:#fff8e1;color:#b45309}.hm-ok{background:#e8f5e9;color:#2e7d32}.hm-hi{background:#1b5e20;color:#fff}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:#1a3a6b;color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;z-index:999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:320px;line-height:1.4;animation:slideIn .25s ease}
.toast.success{background:#2e7d32}
.toast.warn{background:#e65100}
.toast.error{background:#c62828}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

.devx-banner{background:#f3f0ff;border:1px solid #ddd6fe;border-radius:8px;padding:10px 14px;margin-bottom:13px;display:flex;align-items:center;gap:10px;cursor:pointer}

/* NEW FEATURE INLINE — compact banner at top of page */
.new-feature-inline{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fffbeb 0%,#fef3c7 100%);border:1px solid #fde68a;border-radius:9px;padding:10px 14px;margin-bottom:14px;cursor:pointer;transition:all .12s}
.new-feature-inline:hover{border-color:#f59e0b;background:linear-gradient(90deg,#fef3c7 0%,#fde68a 100%)}
.new-feature-pill{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:#fff;letter-spacing:.5px;flex-shrink:0;box-shadow:0 1px 3px rgba(217,119,6,.3)}
.new-feature-inline-text{flex:1;min-width:0}
.new-feature-inline-title{font-size:12px;font-weight:600;color:#92400e;margin-bottom:2px}
.new-feature-inline-sub{font-size:11px;color:#a16207;line-height:1.5}
.new-feature-inline-btn{font-size:11px;font-weight:500;color:#92400e;background:transparent;border:1px solid #fcd34d;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap}
.new-feature-inline-btn:hover{background:#fff;border-color:#d97706;color:#78350f}

/* NEW FEATURE BADGE — floating button bottom-right (secondary cue) */
.new-feature-floating{position:fixed;bottom:20px;right:20px;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:24px;background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:#fff;border:none;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(217,119,6,.4);transition:all .15s;z-index:80;animation:pulse-attention 2s ease-in-out infinite}
.new-feature-floating:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(217,119,6,.5)}
@keyframes pulse-attention{0%,100%{box-shadow:0 4px 14px rgba(217,119,6,.4)}50%{box-shadow:0 4px 14px rgba(217,119,6,.4),0 0 0 6px rgba(245,158,11,.15)}}

/* Inline pill markers — used on titles, buttons, and badges to mark "New" items */

const Toast = ({message, type, onDone}) => {
  useEffect(() => {
    if (!message) return;
    // Longer for info messages with details
    const duration = type === 'info' && message.length > 60 ? 7000 : 2800;
    const t = setTimeout(onDone, duration);
    return () => clearTimeout(t);
  }, [message]);
  if (!message) return null;
  return <div className={`toast ${type || ''}`}>{message}</div>;
};

const MasterTable = ({title,data,setData,collection,cols,addFields,renderRow,note,toast}) => {
  const [search,setSearch] = useState('');
  const [statusFilter,setStatusFilter] = useState('');
  const [showAdd,setShowAdd] = useState(false);
  const [form,setForm] = useState({});
  
  const filtered = data.filter(d => {
    const sMatch = !search || JSON.stringify(d).toLowerCase().includes(search.toLowerCase());
    const stMatch = !statusFilter || d.status === statusFilter;
    return sMatch && stMatch;
  });
  
  const toggleStatus = (rec) => {
    setData(data.map(d => d === rec ? {...d, status: d.status === 'Active' ? 'Inactive' : 'Active'} : d));
    toast(rec.status === 'Active' ? 'Deactivated' : 'Activated', 'success');
  };
  
  const handleAdd = () => {
    const newRec = {...form, status:'Active', updated: new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
    setData([newRec, ...data]);
    setShowAdd(false);
    setForm({});
    toast('Added successfully ✓', 'success');
  };
  
  return (
    <>
      <div className="section-header">
        <div className="filter-row" style={{margin:0}}>
          <input type="text" placeholder={"Search "+title.toLowerCase()+"..."} value={search} onChange={e=>setSearch(e.target.value)} style={{width:200}}/>
          <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="">All statuses</option><option>Active</option><option>Inactive</option>
          </select>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>+ Add {title.toLowerCase()}</button>
      </div>
      {note && <div className="note">{note}</div>}
      <div className="card">
        <div className="scroll-x">
          <table>
            <thead><tr>{cols.map(c=><th key={c}>{c}</th>)}<th>Actions</th></tr></thead>
            <tbody>
              {filtered.map((rec,i)=>(
                <tr key={i}>
                  {renderRow(rec)}
                  <td>
                    <div style={{display:'flex',gap:4}}>
                      <button className="btn btn-sm" onClick={()=>toast('Edit form would open','info')}>Edit</button>
                      <button className="btn btn-sm" onClick={()=>toggleStatus(rec)}>{rec.status==='Active'?'Deactivate':'Activate'}</button>
                    </div>
                  </td>
                </tr>
              ))}
              {filtered.length === 0 && <tr><td colSpan={cols.length+1} style={{textAlign:'center',padding:24,color:'#aaa'}}>No records match filters</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      {showAdd && (
        <Modal title={"Add "+title.toLowerCase()} sub="Fill required fields and save" onClose={()=>setShowAdd(false)}
          footer={<><button className="btn" onClick={()=>setShowAdd(false)}>Cancel</button><button className="btn btn-success" onClick={handleAdd}>Save</button></>}>
          <div className="form-grid">
            {addFields.map(f => (
              <div key={f.name} className={f.full ? 'field' : 'field'} style={f.full ? {gridColumn:'1/-1'} : {}}>
                <label>{f.label} {f.required && '*'}</label>
                {f.type === 'select' ? 
                  <select value={form[f.name]||''} onChange={e=>setForm({...form,[f.name]:e.target.value})}>
                    <option value="">Select...</option>
                    {f.options.map(o=><option key={o}>{o}</option>)}
                  </select>
                  : <input type={f.type||'text'} placeholder={f.placeholder} value={form[f.name]||''} onChange={e=>setForm({...form,[f.name]:e.target.value})}/>
                }
              </div>
            ))}
          </div>
        </Modal>
      )}
    </>
  );
};

const EmployeeSkillMaster = ({toast}) => {
  const [showHeatmap,setShowHeatmap] = useState(false);
  const [opFilter,setOpFilter] = useState('');
  const [levelFilter,setLevelFilter] = useState('');
  
  // Build skill records from OPERATORS
  const allSkills = OPERATORS.flatMap(emp => 
    Object.entries(emp.skills).map(([op, pct]) => ({
      empId:emp.id, name:emp.name, color:emp.color, op, pct,
      smv: 1.20, // simplified
      ct: (1.20/pct*100).toFixed(2),
      stale: emp.id === 'EMP-2602' && op === 'Collar attach', // mark one stale
    }))
  );
  
  const filtered = allSkills.filter(s => {
    if (opFilter && s.op !== opFilter) return false;
    if (levelFilter === 'hi' && s.pct < 90) return false;
    if (levelFilter === 'lo' && s.pct >= 70) return false;
    if (levelFilter === 'stale' && !s.stale) return false;
    return true;

  const allOps = [...new Set(allSkills.map(s=>s.op))];
  
  return (
    <>

const SkillHeatmap = ({onClose,toast}) => {
  const ops = ['Front placket','Collar attach','Sleeve attach','Cuff attach','Thread trimming','Button attach'];
  const lines = ['L-101','L-102','L-103','L-201'];
  // Simulated trained operator counts per (op, line)
  const matrix = {
    'Front placket': {'L-101':4,'L-102':3,'L-103':2,'L-201':4},
    'Collar attach': {'L-101':1,'L-102':2,'L-103':2,'L-201':5},
    'Sleeve attach': {'L-101':5,'L-102':4,'L-103':3,'L-201':7},
    'Cuff attach': {'L-101':3,'L-102':2,'L-103':3,'L-201':4},
    'Thread trimming': {'L-101':3,'L-102':2,'L-103':3,'L-201':3},
    'Button attach': {'L-101':3,'L-102':3,'L-103':2,'L-201':4},
  };
  const cellCls = (n) => n <= 1 ? 'hm-0' : n === 2 ? 'hm-lo' : n <= 5 ? 'hm-ok' : 'hm-hi';
  
  return (
    <Modal size="lg" title="Skill coverage heat map" sub="Operations × lines — trained operator count per cell" onClose={onClose}
      footer={<><button className="btn btn-primary" onClick={()=>{onClose();toast('Redirected to Operation Master — review Collar attach adjacent operations','warn');}}>Go to Operation Master</button><button className="btn" onClick={onClose}>Close</button></>}>
      <div style={{background:'#fdecea',border:'1px solid #ef9a9a',borderRadius:8,padding:'10px 14px',marginBottom:12,fontSize:12,color:'#b71c1c'}}>
        <strong>⚠ 1 critical gap detected:</strong> Collar attach has only 1 trained operator on L-101. Any absence creates a zero-match gap in daily balancing.
      </div>
      <div className="scroll-x">
        <table style={{fontSize:12}}>
          <thead><tr><th>Operation</th>{lines.map(l=><th key={l}>{l}</th>)}<th>Status</th></tr></thead>
          <tbody>
            {ops.map(op=>{
              const counts = lines.map(l=>matrix[op][l]);
              const min = Math.min(...counts);
              const status = min<=1?{cls:'bd',label:'⚠ Critical'}:min===2?{cls:'bw',label:'Watch'}:{cls:'bs',label:'Adequate'};
              return (
                <tr key={op}>
                  <td>{op}</td>
                  {lines.map(l=><td key={l}><span className={'hm-cell '+cellCls(matrix[op][l])}>{matrix[op][l]}</span></td>)}
                  <td><span className={'badge '+status.cls}>{status.label}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{display:'flex',gap:10,marginTop:12,fontSize:11,alignItems:'center'}}>
        <span className="hm-cell hm-0" style={{fontSize:10}}>1</span>Critical
        <span className="hm-cell hm-lo" style={{fontSize:10}}>2</span>Low
        <span className="hm-cell hm-ok" style={{fontSize:10}}>3+</span>Adequate
        <span className="hm-cell hm-hi" style={{fontSize:10}}>6+</span>Strong
      </div>
    </Modal>
  );
};

const OBBuilder = ({initialOps,initialMeta,onCancel,onSave,toast,divisions}) => {
  const [ops,setOps] = useState(initialOps || []);
  const [meta,setMeta] = useState(initialMeta || {styleNum:'',styleName:'',customer:'',div:'SHT',buyer:'',season:''});
  const [smvAlerts,setSmvAlerts] = useState([]);
  const [showAlerts,setShowAlerts] = useState(false);
  
  const totalSMV = ops.reduce((s,o)=>s+(parseFloat(o.smv)||0),0);
  
  const addRow = () => setOps([...ops,{seq:ops.length+1,name:'',smv:0.5,machine:'SNLS',type:'Machine'}]);
  const updateOp = (i,patch) => setOps(ops.map((o,idx)=>idx===i?{...o,...patch}:o));
  const removeOp = (i) => setOps(ops.filter((_,idx)=>idx!==i).map((o,idx)=>({...o,seq:idx+1})));
  const moveUp = (i) => {
    if (i===0) return;
    const newOps = [...ops];
    [newOps[i-1],newOps[i]] = [newOps[i],newOps[i-1]];
    setOps(newOps.map((o,idx)=>({...o,seq:idx+1})));
  };
  
  const save = () => {
    if (!meta.styleNum) { toast('Style number is required','warn'); return; }
    if (totalSMV <= 0) { toast('Total SMV must be > 0','warn'); return; }
    
    // DevX SMV Health Check
    const alerts = [];
    ops.forEach(op => {
      const fd = FLOOR_CT[op.name];
      if (fd && fd.obs >= 5) {
        const smv = parseFloat(op.smv);
        const divergence = (fd.median - smv) / smv * 100;
        if (divergence > 15) {
          alerts.push({op:op.name, smv:smv.toFixed(2), floor:fd.median.toFixed(2), divergence:Math.round(divergence), obs:fd.obs});
        }
      }
    });
    
    if (alerts.length && !showAlerts) {
      setSmvAlerts(alerts);
      setShowAlerts(true);
      return;
    }
    
    onSave({...meta, ops, totalSMV});
    toast('OB saved successfully ✓','success');
  };
  
  return (
    <>
      <DevxCallout
        title="SMV Health Check"
        oneLiner="When you click Save, the system compares each operation's planned SMV against real floor observations from the past 90 days. Mismatches are flagged before the line plan is built on bad numbers."
        problem="Today, bad SMVs are discovered 2 weeks into production — after efficiency targets have already been missed. There is no mechanism to challenge stale time studies at the planning stage."
        impact="Catches planning errors at the moment of creation. Click Save with the example data to see the alert fire (Collar attach is currently flagged based on floor median CT)."
        usage="Triggered automatically on every OB save. Requires 90 days of Phase 6 data to be meaningful — gets more accurate the longer the system runs."
      />
      <div className="ob-banner">
        <button className="btn btn-sm" onClick={onCancel}>← Back</button>
        <div className="ob-banner-item"><span>Style #</span><strong>{meta.styleNum || '—'}</strong></div>
        <div className="ob-banner-item"><span>Customer</span><strong>{meta.customer || '—'}</strong></div>
        <div className="ob-banner-item"><span>Division</span><strong>{meta.div}</strong></div>
      </div>
      
      {showAlerts && smvAlerts.length > 0 && (
        <div className="smv-alert">
          <div className="smv-alert-title">⚠ SMV Health Check <span className="new-pill-inline">★ New</span></div>
          <div className="smv-alert-body">
            Floor observations suggest some SMVs may be understated:<br/>
            {smvAlerts.map((a,i)=>(<div key={i} style={{marginTop:4}}><strong>{a.op}</strong>: SMV {a.smv} min but floor median is {a.floor} min across {a.obs} observations (<strong>{a.divergence}% slower than standard</strong>). Your efficiency plan may be overstated.</div>))}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-sm" onClick={()=>{setShowAlerts(false);setSmvAlerts([]);save();}}>Dismiss and save anyway</button>
            <button className="btn btn-sm btn-primary" onClick={()=>{toast('Opening Operation Master to review SMVs','info');setShowAlerts(false);}}>Review in master →</button>
          </div>
        </div>
      )}
      
      <div className="card">
        <div className="card-header"><div className="card-header-title">OB header</div></div>
        <div className="card-body">
          <div className="form-grid-3">
            <div className="field"><label>Style number *</label><input value={meta.styleNum} onChange={e=>setMeta({...meta,styleNum:e.target.value})} placeholder="e.g. SHT-4900"/></div>
            <div className="field"><label>Style name</label><input value={meta.styleName} onChange={e=>setMeta({...meta,styleName:e.target.value})} placeholder="e.g. Classic Formal Shirt"/></div>
            <div className="field"><label>Customer</label><input value={meta.customer} onChange={e=>setMeta({...meta,customer:e.target.value})}/></div>
            <div className="field"><label>Division *</label><select value={meta.div} onChange={e=>setMeta({...meta,div:e.target.value})}>{divisions.map(d=><option key={d.code}>{d.code}</option>)}</select></div>

            <tbody>

const LineDesignBuilder = ({ob,obOps,onCancel,onSave,toast,lines,divisions}) => {
  const [minMP,setMinMP] = useState(22);
  const [maxMP,setMaxMP] = useState(28);
  const [lineNum,setLineNum] = useState('L-101');
  const [generated,setGenerated] = useState([]);
  const [selectedIdx,setSelectedIdx] = useState(null);
  const [showRelief,setShowRelief] = useState(false);
  const [reliefApplied,setReliefApplied] = useState(false);
  
  const ops = obOps || OB_OPERATIONS['SHT-4821'] || [];
  const totalSMV = ops.reduce((s,o)=>s+o.smv,0);
  const line = lines.find(l => l.num === lineNum) || lines[0];
  const netMin = line ? line.net : 510;
  
  const generate = () => {
    if (minMP > maxMP) { toast('Min must be ≤ Max','warn'); return; }
    const scenarios = [];
    for (let mp = minMP; mp <= maxMP; mp++) {
      const opAssigns = ops.map(op => {
        const proportional = Math.max(1, Math.round((op.smv/totalSMV)*mp));
        return {...op, mp: proportional};
      });
      const totalAssigned = opAssigns.reduce((s,o)=>s+o.mp,0);
      if (totalAssigned !== mp) {
        const diff = mp - totalAssigned;
        const idx = opAssigns.findIndex(o => o.smv === Math.max(...opAssigns.map(x=>x.smv)));
        opAssigns[idx].mp = Math.max(1, opAssigns[idx].mp + diff);
      }
      const opCapacities = opAssigns.map(o => ({...o, capacity: Math.floor((netMin*o.mp)/o.smv)}));
      const bn = opCapacities.reduce((a,b)=>a.capacity<b.capacity?a:b);
      const target = bn.capacity;
      opCapacities.forEach(o => o.skillReq = Math.round((target/o.capacity)*100));
      const eff = Math.round(((totalSMV*target)/(mp*netMin))*100);
      scenarios.push({mp, ops:opCapacities, bn:bn.name, target, eff});
    }
    setGenerated(scenarios);
    setSelectedIdx(Math.floor(scenarios.length/2));
    setReliefApplied(false);
    toast('Generated '+scenarios.length+' scenarios','success');
  };
  
  const selected = selectedIdx !== null ? generated[selectedIdx] : null;
  
  const computeRelief = (scenario) => {
    if (!scenario) return null;
    const bn = scenario.ops.reduce((a,b)=>a.capacity<b.capacity?a:b);
    // Find an over-capacity operation to take 1 from
    const candidates = scenario.ops.filter(o => o.mp > 1 && o.name !== bn.name);
    if (!candidates.length) return null;
    // simulate moving 1 to bn — find best
    let best = null;
    candidates.forEach(c => {
      const newBnCap = Math.floor((netMin*(bn.mp+1))/bn.smv);
      const newCCap = Math.floor((netMin*(c.mp-1))/c.smv);
      const newBn = Math.min(newBnCap, newCCap, ...scenario.ops.filter(o=>o.name!==bn.name&&o.name!==c.name).map(o=>o.capacity));
      if (newBn > scenario.target && (!best || newBn > best.newBn)) {
        const newEff = Math.round(((totalSMV*newBn)/(scenario.mp*netMin))*100);
        best = {from:c.name, to:bn.name, newBn, newEff, currentEff:scenario.eff};
      }
    });
    return best;
  };
  
  const relief = selected ? computeRelief(selected) : null;
  
  const applyRelief = () => {
    if (!relief || !selected) return;
    const newOps = selected.ops.map(o => {
      if (o.name === relief.from) return {...o, mp:o.mp-1, capacity:Math.floor((netMin*(o.mp-1))/o.smv)};
      if (o.name === relief.to) return {...o, mp:o.mp+1, capacity:Math.floor((netMin*(o.mp+1))/o.smv)};
      return o;
    });
    const newBn = newOps.reduce((a,b)=>a.capacity<b.capacity?a:b);
    newOps.forEach(o => o.skillReq = Math.round((newBn.capacity/o.capacity)*100));
    const newSc = {...selected, ops:newOps, bn:newBn.name, target:newBn.capacity, eff:relief.newEff};
    const newGen = [...generated];
    newGen[selectedIdx] = newSc;
    setGenerated(newGen);
    setReliefApplied(true);
    toast('Applied — efficiency improved by '+(relief.newEff-relief.currentEff)+'%','success');
  };
  
  const save = () => {
    if (selected === null) { toast('Select a scenario first','warn'); return; }
    onSave({
      id:(ob?.style||'NEW')+' — LD — '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-'),
      style:ob?.name||'New style', obId:ob?.id||'—', line:lineNum, mp:selected.mp, eff:selected.eff, bn:selected.bn, status:'Pending'
    });
    toast('Line design saved ✓','success');
  };
  
  return (
    <>
      <DevxCallout
        title="Bottleneck Relief Suggestion"
        oneLiner="After you select a scenario, the system identifies the single best operator reallocation and shows the efficiency gain — in 5 seconds. Look for the green card below the scenario detail."
        problem="IEs identify bottlenecks but then spend 20+ minutes in Excel calculating which reallocation gives the biggest efficiency lift. The math is solvable — but no one has time."
        impact="Identifies the optimal reallocation in under 5 seconds. The same answer IEs derive manually, surfaced automatically — saving 1–2 hours of planning per style run."
        usage="Once per Line Design, after scenario selection. Apply or dismiss — IE stays in control."
      />
      <div className="ob-banner">
        <button className="btn btn-sm" onClick={onCancel}>← Back</button>
        <div className="ob-banner-item"><span>OB</span><strong>{ob?.id || 'New OB'}</strong></div>
        <div className="ob-banner-item"><span>Style</span><strong>{ob?.name || '—'}</strong></div>
        <div className="ob-banner-item"><span>Total SMV</span><strong>{totalSMV.toFixed(2)}</strong></div>
        <div className="ob-banner-item"><span>Ops</span><strong>{ops.length}</strong></div>
      </div>
      
      <div className="card">
        <div className="card-header"><div className="card-header-title">Line design setup</div></div>
        <div className="card-body">
          <div className="form-grid-3">
            <div className="field"><label>Line</label><select value={lineNum} onChange={e=>setLineNum(e.target.value)}>{lines.filter(l=>l.status==='Active').map(l=><option key={l.num}>{l.num}</option>)}</select></div>
            <div className="field"><label>Net minutes</label><input value={netMin} disabled/></div>
            <div className="field"><label>&nbsp;</label><div style={{display:'flex',gap:8}}>
              <input type="number" value={minMP} onChange={e=>setMinMP(parseInt(e.target.value)||0)} placeholder="Min MP" style={{width:'45%'}}/>
              <input type="number" value={maxMP} onChange={e=>setMaxMP(parseInt(e.target.value)||0)} placeholder="Max MP" style={{width:'45%'}}/>
            </div></div>
          </div>
          <div style={{marginTop:12,display:'flex',gap:8}}>
            <button className="btn btn-primary" onClick={generate}>Generate scenarios</button>
          </div>
        </div>
      </div>
      
      {generated.length > 0 && (
        <>
          <div className="card">
            <div className="card-header"><div className="card-header-title">Scenario comparison — {generated.length} scenarios</div></div>
            <div className="scroll-x">
              <table>
                <thead><tr><th>MP</th><th>Line eff %</th><th></th><th>Target output</th><th>Bottleneck</th><th></th></tr></thead>
                <tbody>
                  {generated.map((sc,i)=>(
                    <tr key={i} style={{cursor:'pointer', background: i===selectedIdx?'#e8f0fe':''}} onClick={()=>{setSelectedIdx(i);setReliefApplied(false);}}>
                      <td><strong>{sc.mp}</strong></td>
                      <td><span className={skillClass(sc.eff)}><strong>{sc.eff}%</strong></span></td>

                      <td>{sc.target} pcs</td>

                      <td>{i===selectedIdx ? <span className="badge bi">Selected</span> : <button className="btn btn-xs btn-primary" onClick={(e)=>{e.stopPropagation();setSelectedIdx(i);setReliefApplied(false);}}>Select</button>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          
          {selected && (
            <>
              <div className="card">
                <div className="card-header"><div className="card-header-title">Scenario detail — {selected.mp} operators, {selected.eff}% efficiency</div></div>
                <div className="scroll-x">
                  <table>
                    <thead><tr><th>Seq</th><th>Operation</th><th>Type</th><th>SMV</th><th>MP</th><th>Capacity</th><th>Skill req'd %</th></tr></thead>
                    <tbody>
                      {selected.ops.map((op,i)=>(
                        <tr key={i} className={op.name===selected.bn?'op-row bottleneck':''}>
                          <td><strong>{op.seq}</strong></td>
                          <td>{op.name} {op.name===selected.bn && <span className="bn-badge">BOTTLENECK</span>}</td>
                          <td><span className={op.type==='Machine'?'tag-m':'tag-nm'}>{op.type}</span></td>
                          <td>{op.smv.toFixed(2)}</td>
                          <td><strong>{op.mp}</strong></td>
                          <td>{op.capacity}</td>
                          <td><span className={skillClass(op.skillReq)}>{op.skillReq}%</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              
              {relief && !reliefApplied && (
                <div className="bn-suggest">
                  <div className="new-pill-inline">★ New</div>
                  <div className="bn-suggest-body">
                    <div className="bn-suggest-title">Bottleneck Relief Suggestion</div>
                    <div className="bn-suggest-text">Move <strong>1 operator from {relief.from}</strong> to <strong>{relief.to}</strong> — line efficiency improves from <strong>{relief.currentEff}% to {relief.newEff}%</strong> ({relief.newEff-relief.currentEff}% gain). Bottleneck capacity rises from {selected.target} to {relief.newBn} pcs/shift.</div>
                  </div>
                  <div style={{display:'flex',gap:6,flexShrink:0,alignSelf:'center'}}>
                    <button className="btn btn-sm btn-success" onClick={applyRelief}>Apply move</button>
                    <button className="btn btn-sm" onClick={()=>setReliefApplied(true)}>Dismiss</button>
                  </div>
                </div>
              )}
              
              <div className="save-bar">
                <div className="save-bar-label">
                  <strong>Save as Line Design</strong>
                  {selected.mp} operators · {selected.eff}% efficiency · {selected.target} pcs/shift · Bottleneck: {selected.bn}
                </div>
                <button className="btn btn-success" onClick={save}>Save line design</button>
              </div>
            </>
          )}
        </>
      )}
      {generated.length === 0 && <div className="note">Set min/max manpower and click Generate scenarios. The system generates one scenario per integer manpower value.</div>}
    </>
  );
};

const DeploymentPlanning = ({ld,onBack,toast,onFlagTraining}) => {
  const ops = OB_OPERATIONS[ld.obId] || OB_OPERATIONS['SHT-4821'];
  
  // Initial assignment
  const opAssignments = useMemo(() => {
    const used = new Set();
    return ops.map(op => {
      // Find operator with skill on this op
      const candidates = OPERATORS.filter(emp => !used.has(emp.id) && emp.skills[op.name] != null).sort((a,b) => (b.skills[op.name] || 0) - (a.skills[op.name] || 0));
      if (candidates.length) {
        used.add(candidates[0].id);
        return {...op, operator: candidates[0], skillPct: candidates[0].skills[op.name], match:'direct'};
      }
      return {...op, operator: null, skillPct: null, match:'none'};
    });
  }, [ld]);
  
  const [assignments,setAssignments] = useState(opAssignments);
  const [selectedOpIdx,setSelectedOpIdx] = useState(null);
  
  const requiredSkill = 80;
  const flagFor = (a) => {
    if (!a.operator) return {cls:'gap-red', flag:'Uncovered'};
    if (a.match === 'adjacent') return {cls:'gap-blue', flag:'Adjacent only'};
    if (a.skillPct < requiredSkill) return {cls:'gap-amber', flag:'Partial cover'};
    return {cls:'gap-green', flag:'No gap'};
  };
  
  const eff = useMemo(()=>{
    const valid = assignments.filter(a => a.operator);
    if (!valid.length) return 0;
    return Math.round(valid.reduce((s,a)=>s+(a.skillPct||0),0)/valid.length);
  },[assignments]);
  
  const gapCount = assignments.filter(a => !a.operator || a.skillPct < requiredSkill).length;
  
  const assignOperator = (opIdx, operator) => {
    const op = assignments[opIdx];
    const skillOnOp = operator.skills[op.name];
    setAssignments(assignments.map((a,i)=> i===opIdx ? {
      ...a,
      operator,
      skillPct: skillOnOp != null ? skillOnOp : Math.max(...Object.values(operator.skills))-15,
      match: skillOnOp != null ? 'direct' : 'adjacent'
    } : a));
    toast('Assigned '+operator.name,'success');
  };
  
  // Manpower panel — when an op is selected
  const selectedOp = selectedOpIdx !== null ? assignments[selectedOpIdx] : null;
  const usedIds = new Set(assignments.filter(a=>a.operator).map(a=>a.operator.id));
  
  const candidatesFor = (opName) => {
    if (!opName) return {direct:[],adjacent:[],absent:[]};
    const directPresent = OPERATORS.filter(e => !usedIds.has(e.id) && !e.absent && e.skills[opName] != null).sort((a,b)=>b.skills[opName]-a.skills[opName]);
    const adjacent = OPERATORS.filter(e => !usedIds.has(e.id) && !e.absent && e.skills[opName] == null && Object.keys(e.skills).length > 0).slice(0,3);
    const absent = OPERATORS.filter(e => !usedIds.has(e.id) && e.absent && e.skills[opName] != null);
    return {directPresent, adjacent, absent};
  };
  
  return (
    <>
      <div className="ob-banner">
        <button className="btn btn-sm" onClick={onBack}>← Dashboard</button>
        <div className="ob-banner-item"><span>Line Design</span><strong>{ld.id}</strong></div>
        <div className="ob-banner-item"><span>Line</span><strong>{ld.line}</strong></div>
        <div className="ob-banner-item"><span>Style</span><strong>{ld.style}</strong></div>
      </div>
      
      <div className="eff-header">
        <div className="eff-block"><div className="eff-block-label">Expected eff %</div><div className="eff-block-value"><span className={skillClass(eff)}>{eff}%</span></div></div>
        <div className="eff-block"><div className="eff-block-label">Target output</div><div className="eff-block-value">2,640</div><div className="eff-block-sub">pcs/shift</div></div>
        <div className="eff-block"><div className="eff-block-label">Bottleneck</div><div className="eff-block-value" style={{fontSize:14}}>{ld.bn}</div></div>
        <div className="eff-block"><div className="eff-block-label">Manpower</div><div className="eff-block-value">{assignments.filter(a=>a.operator).length}<span style={{fontSize:14,color:'#888'}}>/{assignments.length}</span></div></div>
        <div className="eff-block"><div className="eff-block-label">Skill gaps</div><div className="eff-block-value" style={{color: gapCount > 0 ? '#b71c1c':'#2e7d32'}}>{gapCount}</div></div>
      </div>
      
      <div className="split">
        <div className="card">
          <div className="card-header"><div className="card-header-title">Operation assignments</div></div>
          <div className="scroll-x">
            <table>
              <thead><tr><th>Seq</th><th>Operation</th><th>Skill req</th><th>Operator</th><th>Skill %</th><th>Gap</th><th>Actions</th></tr></thead>
              <tbody>
                {assignments.map((a,i)=>{
                  const f = flagFor(a);
                  return (
                    <tr key={i} style={{cursor:'pointer',background: i===selectedOpIdx?'#e8f0fe':''}} onClick={()=>setSelectedOpIdx(i)}>
                      <td><strong>{a.seq}</strong></td>
                      <td>{a.name}</td>
                      <td>{requiredSkill}%</td>
                      <td>
                        {a.operator ? (
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <Avatar name={a.operator.name} color={a.operator.color}/>
                            <span style={{fontSize:12}}>{a.operator.name}</span>
                          </div>
                        ) : <span style={{color:'#b71c1c',fontSize:11}}>UNASSIGNED</span>}
                      </td>
                      <td>{a.skillPct != null ? <span className={skillClass(a.skillPct)}>{a.skillPct}%</span> : '—'}</td>
                      <td><span className={'gap-dot '+f.cls}></span><span style={{fontSize:11}}>{f.flag}</span></td>
                      <td>
                        {(!a.operator || a.skillPct < requiredSkill) && (
                          <button className="btn btn-xs" style={{borderColor:'#f59e0b',color:'#92400e'}} onClick={(e)=>{e.stopPropagation();onFlagTraining(a);}}>★ Flag</button>
                        )}
                      </td>

              </tbody>

        </div>
        
        <div className="mp-panel">
          <div className="mp-panel-header">

          </div>
          <div className="mp-panel-body">
            {!selectedOp && <div className="mp-empty">Select an operation to view ranked replacements</div>}
            {selectedOp && (() => {
              const c = candidatesFor(selectedOp.name);
              return (
                <>
                  <div className="mp-section-label">Direct skill match — present</div>
                  {c.directPresent.length ? c.directPresent.map(e => (
                    <div key={e.id} className="mp-row" onClick={()=>assignOperator(selectedOpIdx, e)}>
                      <Avatar name={e.name} color={e.color}/>
                      <div className="mp-name">{e.name}<div className="mp-meta">{e.id}</div></div>
                      <div className={'mp-skill '+skillClass(e.skills[selectedOp.name])}>{e.skills[selectedOp.name]}%</div>
                    </div>
                  )) : <div style={{fontSize:11,color:'#aaa',padding:'4px 8px'}}>No direct matches available</div>}
                  
                  <div className="mp-section-label">Adjacent skill match — present</div>
                  {c.adjacent.length ? c.adjacent.map(e => (
                    <div key={e.id} className="mp-row" onClick={()=>assignOperator(selectedOpIdx, e)}>
                      <Avatar name={e.name} color={e.color}/>
                      <div className="mp-name">{e.name}<div className="mp-meta">Adjacent skill</div></div>
                      <div className={'mp-skill '+skillClass(Math.max(...Object.values(e.skills))-15)}>~{Math.max(...Object.values(e.skills))-15}%</div>
                    </div>
                  )) : <div style={{fontSize:11,color:'#aaa',padding:'4px 8px'}}>None</div>}
                  
                  <div className="mp-section-label">Absent today</div>
                  {c.absent.length ? c.absent.map(e => (
                    <div key={e.id} className="mp-row absent" onClick={()=>assignOperator(selectedOpIdx, e)}>
                      <Avatar name={e.name} color={e.color}/>
                      <div className="mp-name">{e.name}<div className="mp-meta">Absent · for late arrivals</div></div>
                      <div className={'mp-skill '+skillClass(e.skills[selectedOp.name])}>{e.skills[selectedOp.name]}%</div>
                    </div>
                  )) : <div style={{fontSize:11,color:'#aaa',padding:'4px 8px'}}>None absent</div>}
                </>
              );
            })()}
          </div>

      </div>
      
      <div className="save-bar">
        <div className="save-bar-label">
          <strong>Save & activate</strong>
          When activated, this plan pushes to the supervisor's tablet interface
        </div>
        <button className="btn" onClick={onBack}>Save draft</button>
        <button className="btn btn-success" onClick={()=>{toast('Plan activated — supervisor notified','success');onBack();}}>Activate plan →</button>
      </div>
    </>
  );
};

/* ════════════════════════════════════════════════════════════════
   PHASE 5 — DAILY BALANCING (tablet-responsive)
════════════════════════════════════════════════════════════════ */
const DailyBalancing = ({data,toast,onOpenCT}) => {
  // Build deployment from active LD
  const activeLD = data.lineDesigns.find(l=>l.status==='Active') || data.lineDesigns[0];
  const ops = OB_OPERATIONS[activeLD.obId] || OB_OPERATIONS['SHT-4821'];
  
  // Initial deployment — multiple operators per operation (matching Phase 4 LD allocation)
  // 28 total operators across 8 operations, some absent triggering auto-fill
  const initialDeployment = useMemo(()=>{
    const used = new Set();
    // Define MP per operation based on SMV proportional to total — same as Phase 4
    const totalSMV = ops.reduce((s,o)=>s+o.smv,0);
    const totalMP = 28;
    
    return ops.map(op => {
      const mpForOp = Math.max(1, Math.round((op.smv/totalSMV)*totalMP));
      
      // Find candidates (direct skill match), pick top N up to mpForOp
      const direct = OPERATORS
        .filter(emp => !used.has(emp.id) && emp.skills[op.name] != null)
        .sort((a,b)=>(b.skills[op.name]||0)-(a.skills[op.name]||0));
      
      const adjacent = OPERATORS
        .filter(emp => !used.has(emp.id) && emp.skills[op.name] == null && Object.keys(emp.skills).length > 0)
        .slice(0, Math.max(0, mpForOp - direct.length));
      
      const all = [...direct, ...adjacent].slice(0, mpForOp);
      
      const assigned = all.map(emp => {
        used.add(emp.id);
        const directSkill = emp.skills[op.name];
        const skillPct = directSkill != null ? directSkill : Math.max(...Object.values(emp.skills)) - 15;
        return {...emp, skillPct, isAutoFill:false, isAdjacent: directSkill == null};
      });
      
      return {...op, assigned, mpRequired: mpForOp};
    });
  },[activeLD]);
  
  const [deployment,setDeployment] = useState(initialDeployment);
  const [showAutoFillBanner,setShowAutoFillBanner] = useState(true);
  const [selectedOpIdx,setSelectedOpIdx] = useState(null);
  const [countdown,setCountdown] = useState(450); // 7:30 mins to shift start
  const [saved,setSaved] = useState(false);
  
  // Detect absences
  const absentOnLine = deployment.flatMap(op => op.assigned.filter(a => a.absent));
  const gapCount = deployment.filter(op => op.assigned.length === 0 || op.assigned.some(a=>a.absent && !op.assigned.some(b=>!b.absent))).length;
  
  // Countdown timer
  useEffect(()=>{
    if (countdown <= 0) return;
    const t = setTimeout(()=>setCountdown(c=>c-1),1000);
    return ()=>clearTimeout(t);
  },[countdown]);
  
  const fmtTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
  const urgencyClass = countdown <= 120 ? {bg:'#fdecea',col:'#b71c1c',bd:'#ef9a9a'} : countdown <= 300 ? {bg:'#fff8e1',col:'#b45309',bd:'#ffe082'} : {bg:'#fff',col:'#1a1a1a',bd:'#e5e5e5'};
  
  // Auto-fill logic — KEEP absent operators visible (struck through) and add replacements alongside them
  // This preserves the "before/after intelligence" visual for demos
  const runAutoFill = () => {
    const usedIds = new Set();
    // Reserve all currently-assigned present operators
    deployment.forEach(o => o.assigned.forEach(a => { if (!a.absent) usedIds.add(a.id); }));
    
    const filled = deployment.map(op => {
      const absentInOp = op.assigned.filter(a => a.absent);
      const absentCount = absentInOp.length;
      
      if (absentCount === 0) return op;
      
      // Find a replacement for each absent operator
      const replacements = [];
      absentInOp.forEach(absentOp => {
        const candidate = OPERATORS
          .filter(e => !usedIds.has(e.id) && !e.absent && e.skills[op.name] != null)
          .sort((a,b)=>b.skills[op.name]-a.skills[op.name])[0]
          || OPERATORS
              .filter(e => !usedIds.has(e.id) && !e.absent && Object.keys(e.skills).length > 0)
              .sort((a,b)=>Math.max(...Object.values(b.skills))-Math.max(...Object.values(a.skills)))[0];
        
        if (candidate) {
          usedIds.add(candidate.id);
          const directSkill = candidate.skills[op.name];
          replacements.push({
            ...candidate,
            skillPct: directSkill != null ? directSkill : Math.max(...Object.values(candidate.skills)) - 15,
            isAutoFill: true,
            isAdjacent: directSkill == null,
            replacingId: absentOp.id,  // track which absent op this replaces
            replacingName: absentOp.name,
          });
        }
      });
      
      // KEY CHANGE: keep ALL original assignments (including absent ones marked clearly) 
      // and append the auto-fill replacements right after each absent operator
      const newAssigned = [];
      op.assigned.forEach(a => {
        newAssigned.push(a);  // keep absent operator visible
        if (a.absent) {
          const replacement = replacements.find(r => r.replacingId === a.id);
          if (replacement) newAssigned.push(replacement);  // add replacement immediately after
        }
      });
      
      return {...op, assigned: newAssigned};
    });
    setDeployment(filled);
  };
  
  // Approve all auto-fills — only NOW do we remove the absent operators (they've been "covered")
  const approveAll = () => {
    setDeployment(deployment.map(op => ({
      ...op,
      assigned: op.assigned
        .filter(a => !a.absent)  // remove absent operators now that replacements are confirmed
        .map(a=>({...a,isAutoFill:false}))  // un-mark auto-fills as confirmed
    })));
    setShowAutoFillBanner(false);
    toast('All auto-fills approved · '+deployment.flatMap(o=>o.assigned).filter(a=>a.isAutoFill).length+' gaps closed ✓','success');
  };
  
  // Run auto-fill on mount if there are absences (and we haven't filled yet)
  useEffect(()=>{
    const hasAbsent = deployment.some(op => op.assigned.some(a => a.absent));
    const noFillsYet = deployment.every(op => op.assigned.every(a=>!a.isAutoFill));
    if (hasAbsent && noFillsYet) {
      runAutoFill();
    }
  },[]);
  
  const autoFilledOps = deployment.filter(op => op.assigned.some(a => a.isAutoFill));
  
  const candidatesFor = (opName) => {
    if (!opName) return {present:[],adjacent:[],absent:[]};
    const usedIds = new Set(deployment.flatMap(o=>o.assigned.map(a=>a.id)));
    const present = OPERATORS.filter(e => !usedIds.has(e.id) && !e.absent && e.skills[opName] != null).sort((a,b)=>b.skills[opName]-a.skills[opName]);
    const adjacent = OPERATORS.filter(e => !usedIds.has(e.id) && !e.absent && e.skills[opName] == null && Object.keys(e.skills).length>0).slice(0,2);
    const absent = OPERATORS.filter(e => !usedIds.has(e.id) && e.absent && e.skills[opName] != null);
    return {present, adjacent, absent};
  };
  
  const swapAssignment = (opIdx, operator) => {
    const op = deployment[opIdx];
    setDeployment(deployment.map((d,i)=>i===opIdx ? {
      ...d,
      assigned: [{...operator, skillPct:operator.skills[op.name] || 70, isAutoFill:false}]
    } : d));
    toast('Swapped to '+operator.name,'success');
  };
  
  const totalSkill = deployment.reduce((s,op) => {
    const valid = op.assigned.filter(a=>!a.absent);
    if (!valid.length) return s;
    return s + valid.reduce((s2,a)=>s2+(a.skillPct||0),0)/valid.length;
  },0);
  const liveEff = Math.round(totalSkill/deployment.length);
  
  const saveDeployment = () => {
    setSaved(true);
    toast('Deployment saved and locked for today ✓','success');
  };
  
  return (
    <>
      <DevxCallout
        title="Auto-Fill All Gaps"
        oneLiner="The system has already pre-assigned the best operator to every absent position. You review and approve in 60 seconds — not fill one by one for 15 minutes."

        usage="Every single shift start, every day, for every active line. The highest-frequency feature in the entire system."
      />

      </div>
      
      <div className="urgency-bar" style={{background:urgencyClass.bg, borderColor:urgencyClass.bd}}>
        <div>
          <div className="urgency-label" style={{color:urgencyClass.col}}>Shift starts in</div>
          <div className="urgency-timer" style={{color:urgencyClass.col}}>{fmtTime(countdown)}</div>
        </div>
        <div style={{width:1,height:32,background:urgencyClass.bd}}/>
        <div>
          <div className="urgency-label" style={{color:urgencyClass.col}}>Absences detected</div>
          <div style={{fontSize:18,fontWeight:600,color:'#b71c1c'}}>{deployment.flatMap(o=>o.assigned).filter(a=>a.absent).length}</div>
        </div>
        <div style={{width:1,height:32,background:urgencyClass.bd}}/>
        <div>
          <div className="urgency-label" style={{color:urgencyClass.col}}>★ Auto-filled by system</div>
          <div style={{fontSize:18,fontWeight:600,color:'#0f766e'}}>{deployment.flatMap(o=>o.assigned).filter(a=>a.isAutoFill).length}</div>
        </div>
        <div className="urgency-gaps" style={{color:urgencyClass.col}}>
          {countdown <= 120 ? '⚠ Shift starting' : showAutoFillBanner && autoFilledOps.length > 0 ? '★ Ready for review' : autoFilledOps.length === 0 ? '✓ All gaps filled' : ''}

const CTCaptureModal = ({op,operator,onClose,onSave,toast}) => {
  const [ct,setCt] = useState('');
  const skillPct = ct && parseFloat(ct) > 0 ? Math.round((op.smv / parseFloat(ct)) * 100) : null;
  const result = skillPct == null ? null : skillPct >= 90 ? 'good' : skillPct >= 70 ? 'warn' : 'bad';
  
  const save = () => {
    if (!ct || parseFloat(ct) <= 0) { toast('Cycle time must be > 0','warn'); return; }
    const ctVal = parseFloat(ct);
    if (ctVal > op.smv * 10) {
      if (!confirm('CT is 10x the SMV — are you sure?')) return;
    }
    onSave({op:op.name, operator:operator.name, opCode:op.opCode, empId:operator.id, ct:ctVal, smv:op.smv, skillPct, observedAt:new Date()});
    
    // Check for milestone
    if (skillPct >= 90) {
      toast('🎯 Milestone reached — '+operator.name+' crossed 90% on '+op.name,'success');
    } else if (skillPct >= 85) {
      toast('Milestone progress — '+operator.name+' approaching 90%','info');
    } else {
      toast('CT saved · Skill % updated to '+skillPct+'%','success');
    }
    onClose();
  };
  
  return (
    <Modal title="Capture cycle time" sub={op.name+' · '+operator.name} onClose={onClose}
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-success" onClick={save} disabled={!ct}>Save observation</button></>}>
      <div className="form-grid">
        <div className="field"><label>Operator</label><input value={operator.name+' ('+operator.id+')'} disabled/></div>
        <div className="field"><label>Operation</label><input value={op.name+' ('+op.opCode+')'} disabled/></div>
        <div className="field"><label>SMV (min)</label><input value={op.smv.toFixed(4)} disabled/></div>
        <div className="field"><label>Date</label><input type="date" defaultValue={new Date().toISOString().split('T')[0]}/></div>
        <div className="field" style={{gridColumn:'1/-1'}}>
          <label>Observed cycle time (minutes) *</label>
          <input type="number" step="0.01" value={ct} onChange={e=>setCt(e.target.value)} placeholder="e.g. 1.25" autoFocus/>
        </div>
      </div>
      {skillPct != null && (
        <div className={'skill-result '+result} style={{marginTop:12}}>
          <div>
            <div className="skill-result-label">Calculated Skill %</div>
            <div style={{fontSize:11,color:'#888',marginTop:2}}>SMV ({op.smv.toFixed(2)}) ÷ CT ({parseFloat(ct).toFixed(2)}) × 100</div>
          </div>
          <div className="skill-result-value" style={{color:skillColor(skillPct)}}>{skillPct}%</div>
        </div>
      )}
      <div style={{fontSize:11,color:'#888',marginTop:6,padding:'6px 0'}}>Observer: {ROLES.Supervisor.email}. Auto-stamped on save.</div>
    </Modal>
  );
};

        problem="Today, when an operator improves, nobody knows. They continue to be treated as a training case for months longer than necessary. The loop from training to confirmed improvement is manual and lossy."
        impact="Closes the loop: training gap identified in Phase 4 → training conducted → improvement confirmed → record updated → flag closed — all automatically, no manual review."
        usage="Triggered automatically — fires when any operator crosses a milestone. Typically 2–5 alerts per division per month, rising as more CT data is captured."
      />
      <div className="note">All cycle time observations · per operator per operation · trend per recent vs previous observations</div>
      <div className="filter-row">
        <select><option>All operations</option><option>Collar attach</option><option>Sleeve attach</option></select>
        <select><option>All operators</option></select>
        <select><option>Last 90 days</option><option>Last 30 days</option><option>All time</option></select>
        <div style={{marginLeft:'auto'}}><button className="btn btn-sm" onClick={()=>toast('Exporting...','info')}>Export to Excel</button></div>
      </div>
      
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:12,marginBottom:14}}>
        {trendData.map((t,i)=>{
          const min = Math.min(...t.history);
          const max = Math.max(...t.history);
          return (
            <div key={i} className="trend-card">
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                <Avatar name={t.emp.name} color={t.emp.color}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:600}}>{t.emp.name}</div>
                  <div style={{fontSize:10,color:'#888'}}>{t.op}</div>
                </div>
                <div style={{fontSize:18,fontWeight:700,color:skillColor(t.current)}}>{t.current}%</div>
              </div>
              <div className="sparkline">
                {t.history.map((v,j)=>(
                  <div key={j} className="spark-bar" style={{height:((v-min)/(max-min)*30+6)+'px', background:skillColor(v)}}/>
                ))}
              </div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#888'}}>
                <span>{t.history.length} observations</span>
                <span>{t.trend === 'up' ? '↑ Improving' : t.trend === 'down' ? '↓ Declining' : '→ Stable'}</span>
              </div>
            </div>
          );
        })}
      </div>
      
      <div className="card">
        <div className="card-header"><div className="card-header-title">All observations</div></div>
        <div className="scroll-x">
          <table>
            <thead><tr><th>Date</th><th>Operator</th><th>Operation</th><th>SMV</th><th>CT</th><th>Skill %</th><th>Trend</th><th>Observer</th></tr></thead>
            <tbody>
              <tr><td>Today 10:42</td><td>Meena R.</td><td>Front placket</td><td>0.85</td><td>0.78</td><td><span className="skill-hi">109%</span></td><td>↑</td><td style={{fontSize:11,color:'#888'}}>sup.rajesh@arvind.com</td></tr>
              <tr><td>Today 10:35</td><td>Priya S.</td><td>Collar attach</td><td>1.20</td><td>1.43</td><td><span className="skill-mid">84%</span></td><td>↑</td><td style={{fontSize:11,color:'#888'}}>sup.rajesh@arvind.com</td></tr>
              <tr><td>Today 10:20</td><td>Ravi K.</td><td>Collar attach</td><td>1.20</td><td>1.76</td><td><span className="skill-lo">68%</span></td><td>↓</td><td style={{fontSize:11,color:'#888'}}>sup.rajesh@arvind.com</td></tr>
              <tr><td>Yesterday 16:14</td><td>Geetha S.</td><td>Sleeve attach</td><td>1.45</td><td>1.53</td><td><span className="skill-hi">95%</span></td><td>↑</td><td style={{fontSize:11,color:'#888'}}>sup.rajesh@arvind.com</td></tr>
              <tr><td>Yesterday 15:38</td><td>Babu T.</td><td>Button attach</td><td>0.95</td><td>0.96</td><td><span className="skill-hi">99%</span></td><td>→</td><td style={{fontSize:11,color:'#888'}}>sup.rajesh@arvind.com</td></tr>
              <tr><td>2 days ago</td><td>Nanda K.</td><td>Collar attach</td><td>1.20</td><td>1.54</td><td><span className="skill-mid">78%</span></td><td>→</td><td style={{fontSize:11,color:'#888'}}>sup.rajesh@arvind.com</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
};

/* ════════════════════════════════════════════════════════════════
   MAIN APP
════════════════════════════════════════════════════════════════ */
const App = () => {
  const [role,setRole] = useState('Admin');
  const [data,setData] = useState(INITIAL_DATA);
  const [view,setView] = useState('masters');
  const [obData,setObData] = useState(null); // current OB being edited/created
  const [obMode,setObMode] = useState(null); // 'create' or 'edit'
  const [showOBCreate,setShowOBCreate] = useState(false);
  const [ldData,setLdData] = useState(null);
  const [ldMode,setLdMode] = useState(null);
  const [deployLD,setDeployLD] = useState(null);
  const [toast,setToast] = useState(null);
  const [showTrainingPanel,setShowTrainingPanel] = useState(false);
  const [trainingFlags,setTrainingFlags] = useState([
    {empName:'Ravi K.', opName:'Collar attach', currentSkill:68, requiredSkill:80, flaggedAt:'Today 09:14', status:'open'},
    {empName:'Nanda K.', opName:'Collar attach', currentSkill:78, requiredSkill:80, flaggedAt:'Yesterday', status:'open'},
    {empName:'Usha V.', opName:'Sleeve attach', currentSkill:76, requiredSkill:85, flaggedAt:'3 days ago', status:'open'},
  ]);
  const [ctModal,setCtModal] = useState(null); // {op, operator}
  
  const showToast = (message, type) => setToast({message, type, key: Date.now()});
  
  // Set default view per role
  useEffect(()=>{
    if (role === 'Admin') setView('masters');
    else if (role === 'IE') setView('ob');
    else setView('daily');
  },[role]);
  
  const flagForTraining = (assignment) => {
    if (!assignment.operator) {
      showToast('Cannot flag — no operator assigned','warn');
      return;
    }
    setTrainingFlags([{
      empName: assignment.operator.name,
      opName: assignment.name,
      currentSkill: assignment.skillPct || 0,
      requiredSkill: 80,
      flaggedAt: 'Just now',
      status:'open'
    }, ...trainingFlags]);
    showToast('Flagged '+assignment.operator.name+' for training on '+assignment.name+' ✓','success');
  };
  
  // Topbar title
  const titles = {
    masters:{t:'Masters home',s:'All masters'},
    division:{t:'Division master',s:'SAP-aligned'},
    factory:{t:'Factory master',s:'SAP-aligned'},
    line:{t:'Line master',s:'Shift config at line level'},
    machine:{t:'Machine master',s:'Factory-level'},
    operation:{t:'Operation master',s:'SMV + adjacent operations'},
    skill:{t:'Employee skill master',s:'Skill % per operator per operation'},
    integration:{t:'Integration health',s:'SAP + HRMS · sync runs and errors'},
    ob:{t:'Operation bulletins',s:'OBs for active styles'},
    ld:{t:'Line design',s:'Scenario generation engine'},
    dashboard:{t:'Assignment dashboard',s:'All lines · planned vs actual'},
    deploy:{t:'Deployment planning',s:'Skill-based assignment'},
    daily:{t:'Daily balancing',s:'Today\'s deployment'},
    'ct-priority':{t:'Capture priority',s:'Who to observe today'},
    'ct-history':{t:'Skill history',s:'CT observations and trends'},
  };
  const t = titles[view] || titles.masters;
  
  return (
    <div className="app">
      <Sidebar current={view} onNav={(v)=>{setView(v);setObMode(null);setLdMode(null);setDeployLD(null);}} role={role}/>
      <div className="main">
        <div className="topbar">
          <div>
            <div className="t-title">{t.t}</div>
            <div className="t-meta">{t.s}</div>
          </div>
          <div className="topbar-right">
            {(view === 'dashboard' || view === 'deploy') && role === 'IE' && (
              <button className="btn btn-sm" style={{borderColor:'#c4a8f0',color:'#5b21b6',background:'#f3f0ff'}} onClick={()=>setShowTrainingPanel(true)}>
                ★ Training register ({trainingFlags.filter(t=>t.status==='open').length})
              </button>
            )}
            <div className="role-switcher">
              <span className="role-switcher-label">View as:</span>
              <button className={`role-pill ${role==='Admin'?'active':''}`} onClick={()=>setRole('Admin')} title="Masters & data foundation">
                Admin
              </button>
              <button className={`role-pill ${role==='IE'?'active':''}`} onClick={()=>setRole('IE')} title="OBs, Line Design, Deployment Planning, Skill History">
                IE
              </button>
              <button className={`role-pill ${role==='Supervisor'?'active':''}`} onClick={()=>setRole('Supervisor')} title="Daily Balancing & Cycle Time">
                Supervisor
              </button>
            </div>
          </div>
        </div>
        
        <div className="content">
          {view === 'masters' && <MastersHome data={data} onNav={setView}/>}
          {view === 'division' && <DivisionMaster data={data} setData={setData} toast={showToast}/>}
          {view === 'factory' && <FactoryMaster data={data} setData={setData} toast={showToast}/>}
          {view === 'line' && <LineMaster data={data} setData={setData} toast={showToast}/>}
          {view === 'machine' && <MachineMaster data={data} setData={setData} toast={showToast}/>}
          {view === 'operation' && <OperationMaster data={data} setData={setData} toast={showToast}/>}
          {view === 'skill' && <EmployeeSkillMaster toast={showToast}/>}
          {view === 'integration' && <IntegrationHealth toast={showToast}/>}
          
          {view === 'ob' && !obMode && (
            <OBList data={data} setData={setData}
              toast={showToast}
              onCreate={()=>setShowOBCreate(true)}
              onEdit={(ob)=>{setObData({...ob, ops:OB_OPERATIONS[ob.id]||[]});setObMode('edit');}}
              onCreateLD={(ob)=>{setLdData({ob,obOps:OB_OPERATIONS[ob.id]});setLdMode('create');setView('ld');}}
            />
          )}
          {view === 'ob' && obMode === 'create' && (
            <OBBuilder initialOps={obData?.ops || []} initialMeta={obData?.meta} 
              divisions={data.divisions}
              onCancel={()=>{setObMode(null);setObData(null);}} 
              onSave={(saved)=>{
                const newOb = {id:saved.styleNum, style:saved.styleNum, name:saved.styleName, customer:saved.customer, div:saved.div, season:saved.season, created:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}), ops:saved.ops.length, smv:saved.totalSMV};
                setData({...data, obs:[newOb, ...data.obs]});
                OB_OPERATIONS[saved.styleNum] = saved.ops;
                setObMode(null);setObData(null);
              }} toast={showToast}/>
          )}
          {view === 'ob' && obMode === 'edit' && (
            <OBBuilder initialOps={obData?.ops || []} initialMeta={{styleNum:obData?.style||'',styleName:obData?.name||'',customer:obData?.customer||'',div:obData?.div||'SHT',buyer:'',season:obData?.season||''}}
              divisions={data.divisions}
              onCancel={()=>{setObMode(null);setObData(null);}}
              onSave={(saved)=>{
                OB_OPERATIONS[obData.id] = saved.ops;
                setData({...data, obs:data.obs.map(o=>o.id===obData.id?{...o,name:saved.styleName,customer:saved.customer,ops:saved.ops.length,smv:saved.totalSMV}:o)});
                setObMode(null);setObData(null);
              }} toast={showToast}/>
          )}
          
          {view === 'ld' && ldMode !== 'create' && (
            <LineDesignList data={data} toast={showToast}
              onCreate={()=>{setLdData({ob:null,obOps:OB_OPERATIONS['SHT-4821']});setLdMode('create');}}
              onDeploy={(ld)=>{setDeployLD(ld);setView('deploy');}}
            />
          )}
          {view === 'ld' && ldMode === 'create' && (
            <LineDesignBuilder ob={ldData?.ob} obOps={ldData?.obOps} 
              lines={data.lines} divisions={data.divisions}
              onCancel={()=>{setLdMode(null);setLdData(null);}}
              onSave={(ld)=>{
                setData({...data, lineDesigns:[ld, ...data.lineDesigns]});
                setLdMode(null);setLdData(null);
              }} toast={showToast}/>
          )}
          
          {view === 'dashboard' && (
            <AssignmentDashboard data={data} toast={showToast}
              onDeploy={(ld)=>{setDeployLD(ld);setView('deploy');}}
              onActivate={(ld)=>{
                setData({...data, lineDesigns: data.lineDesigns.map(l => l.id===ld.id ? {...l,status:'Active'} : l)});
                showToast('Activated '+ld.id+' on '+ld.line,'success');
              }}
              trainingFlags={trainingFlags}
              onShowTraining={()=>setShowTrainingPanel(true)}
            />
          )}
          
          {view === 'deploy' && deployLD && (
            <DeploymentPlanning ld={deployLD} 
              onBack={()=>{setView('dashboard');setDeployLD(null);}}
              toast={showToast}
              onFlagTraining={flagForTraining}
            />
          )}
          {view === 'deploy' && !deployLD && <div className="note">No line design selected. Open the Assignment Dashboard and click Deploy on any line.</div>}
          
          {view === 'daily' && <DailyBalancing data={data} toast={showToast} onOpenCT={(op,operator)=>setCtModal({op,operator})}/>}
          {view === 'ct-priority' && <CapturePriorityScreen toast={showToast} onOpenCT={(op,operator)=>setCtModal({op,operator})}/>}
          {view === 'ct-history' && <SkillHistory toast={showToast}/>}
        </div>
      </div>
      
      {showOBCreate && <OBCreateModal onClose={()=>setShowOBCreate(false)} toast={showToast}
        onSelect={(s)=>{
          setObData({ops:s.ops, meta:s.mode==='copy'?{...data.obs[0]}:null});
          setObMode('create');
        }}
      />}
      
      {showTrainingPanel && <TrainingRegister flags={trainingFlags} onClose={()=>setShowTrainingPanel(false)} toast={showToast}/>}
      
      {ctModal && <CTCaptureModal op={ctModal.op} operator={ctModal.operator}
        onClose={()=>setCtModal(null)}
        onSave={(obs)=>{
          // Check if this resolves a training flag
          setTrainingFlags(trainingFlags.map(f => 
            f.empName === obs.operator && f.opName === obs.op && obs.skillPct >= f.requiredSkill 
              ? {...f, status:'resolved'} : f
          ));
        }}
        toast={showToast}
      />}
      
      {toast && <Toast key={toast.key} message={toast.message} type={toast.type} onDone={()=>setToast(null)}/>}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
